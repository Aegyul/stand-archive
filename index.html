:root{--bg:#0b0e17;--surface:#141927;--surface2:#1b2132;--stroke:#2b3245;--text:#eff0f7;--muted:#a2a8b8;--accent:#c8acf7;--gold:#e8c68a}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 'DM Sans','Noto Sans KR',sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1320px;margin:auto;padding:0 30px}.site-header{border-bottom:1px solid var(--stroke);position:sticky;top:0;z-index:20;background:#0b0e17e8;backdrop-filter:blur(18px)}.nav{height:70px;display:flex;align-items:center;justify-content:space-between;gap:16px}.logo{font-weight:900;letter-spacing:.15em;font-size:17px;white-space:nowrap}.logo i{font-style:normal;color:var(--accent)}.nav-side{display:flex;gap:12px;align-items:center}.tiny{font-size:11px;color:var(--muted);letter-spacing:.12em}.pill{padding:8px 13px;background:#21263a;border:1px solid var(--stroke);border-radius:30px;color:var(--text);font-size:12px;white-space:nowrap}.pill:hover{border-color:var(--accent)}.hero{padding:76px 0 45px;position:relative;overflow:hidden}.hero:before{content:'';position:absolute;width:600px;height:450px;right:-160px;top:-175px;background:radial-gradient(ellipse,#58407a55,transparent 70%);pointer-events:none}.eyebrow{font-size:12px;letter-spacing:.27em;font-weight:800;color:var(--gold)}h1{font-weight:900;line-height:1.15;letter-spacing:-.05em;font-size:clamp(36px,5.5vw,70px);margin:20px 0}h1 em{font-style:normal;color:var(--accent)}.lead{color:var(--muted);max-width:650px;font-size:15px}.metrics{display:flex;flex-wrap:wrap;gap:12px;margin:36px 0 0}.metric{background:var(--surface);border:1px solid var(--stroke);padding:13px 18px;border-radius:13px;min-width:140px}.metric strong{font-size:26px;display:block;line-height:1.3}.metric span{font-size:11px;color:var(--muted)}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:22px 0}.search{background:var(--surface);border:1px solid var(--stroke);padding:14px 18px;border-radius:12px;color:var(--text);min-width:230px;flex:1;outline:none}.search:focus{border-color:var(--accent)}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{border:1px solid var(--stroke);background:var(--surface);color:var(--muted);padding:11px 13px;border-radius:10px;font-size:12px}.filter.active{color:#161124;background:var(--accent);border-color:var(--accent);font-weight:800}.sort{padding:11px;border-radius:10px;background:var(--surface);color:var(--text);border:1px solid var(--stroke)}.results{color:var(--muted);font-size:12px;margin:0 0 18px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{position:relative;overflow:hidden;text-align:left;background:linear-gradient(165deg,#1d2334,#111521);border:1px solid var(--stroke);color:var(--text);border-radius:17px;padding:0;min-height:270px;display:flex;flex-direction:column;transition:.18s transform,.18s border-color}.card:hover{transform:translateY(-4px);border-color:var(--accent)}.card:focus-visible{outline:2px solid var(--accent)}.card-art{height:116px;position:relative;overflow:hidden;background:radial-gradient(circle at 60% 40%,var(--tint),transparent 67%),linear-gradient(125deg,#25263d,#131625)}.symbol{font-size:82px;line-height:1;position:absolute;right:18px;top:7px;color:#ffffff18;font-weight:900}.art-index{position:absolute;left:18px;top:15px;color:#ffffff8a;font-size:12px;font-weight:800;letter-spacing:.12em}.art-type{position:absolute;left:18px;bottom:14px;background:#0b0d17b8;padding:4px 9px;border-radius:7px;color:#c9cad9;font-size:10px;max-width:calc(100% - 36px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card-body{padding:18px 19px 21px;display:flex;flex-direction:column;flex:1}.card h3{margin:0;font-size:18px;line-height:1.4;letter-spacing:.015em}.card .ability{color:var(--accent);font-size:12px;font-weight:800;margin-top:7px}.card .summary{color:var(--muted);font-size:12px;line-height:1.8;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;margin:10px 0 16px}.card-bottom{margin-top:auto;border-top:1px solid var(--stroke);padding-top:12px;display:flex;align-items:center;justify-content:space-between;gap:4px}.grades{display:flex;gap:5px}.grade{min-width:22px;height:25px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#dedbea;background:#292d42;border-radius:5px}.grade.unknown{color:var(--gold);background:#3c352f}.more{font-size:11px;color:var(--accent);white-space:nowrap}.no-results{padding:56px 20px;text-align:center;color:var(--muted);grid-column:1/-1;border:1px dashed var(--stroke);border-radius:16px}.footer{border-top:1px solid var(--stroke);margin-top:70px;padding:27px 0 48px;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;color:var(--muted);font-size:12px}.footer strong{color:var(--text)}dialog{padding:0;border:1px solid #49516a;background:#121725;color:var(--text);border-radius:20px;max-width:950px;width:calc(100% - 28px);max-height:92vh;box-shadow:0 35px 120px #000c}dialog::backdrop{background:#02050ccc;backdrop-filter:blur(5px)}.detail-top{padding:30px 35px 26px;background:radial-gradient(circle at 85% 25%,var(--tint),transparent 60%),#1c2130;position:relative}.close{position:absolute;right:18px;top:16px;background:#1015239c;border:1px solid #ffffff26;color:#fff;border-radius:9px;padding:5px 12px;font-size:22px}.detail-kicker{font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--gold)}.detail-title{font-size:clamp(25px,4vw,43px);font-weight:900;letter-spacing:-.03em;margin:15px 0 6px;line-height:1.2}.detail-sub{font-size:13px;color:#c9c9d9}.detail-body{padding:30px 35px;display:grid;grid-template-columns:1fr 315px;gap:32px;overflow-y:auto;max-height:calc(92vh - 185px)}.detail-body h4{font-size:12px;color:var(--gold);letter-spacing:.1em;margin:25px 0 9px}.detail-body h4:first-child{margin-top:0}.detail-body p{color:#c9ced9;font-size:13px;line-height:1.95;margin:0}.radar-panel{background:#171d2e;border:1px solid var(--stroke);padding:14px;border-radius:14px;align-self:start}.radar-panel svg{width:100%;display:block}.radar-head{text-align:center;font-size:12px;font-weight:800;letter-spacing:.12em;margin:6px 0 10px}.stat-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}.stat-table td{padding:7px 3px;border-top:1px solid var(--stroke)}.stat-table td:last-child{text-align:right;font-weight:800;font-size:13px;color:var(--accent)}.stat-note{font-size:10px;color:var(--muted);line-height:1.65;margin:10px 0 0}.utility{display:flex;gap:8px;flex-wrap:wrap}.tool-btn{background:var(--surface2);border:1px solid var(--stroke);border-radius:10px;color:var(--text);font-size:12px;padding:10px 12px}.tool-btn:hover{border-color:var(--accent)}#importFile{display:none}.notice{margin:8px 0 0;color:var(--muted);font-size:11px}.badge-special{color:#edc78b;margin-left:8px;font-size:10px;border:1px solid #b3915f7a;border-radius:5px;padding:2px 5px}@media(max-width:950px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.detail-body{grid-template-columns:1fr}.radar-panel{max-width:400px}.detail-body{max-height:calc(92vh - 170px)}}@media(max-width:590px){.shell{padding:0 17px}.hero{padding:44px 0 22px}.nav{height:60px}.nav-side .tiny{display:none}.metrics{gap:8px}.metric{flex:1;min-width:90px;padding:11px}.metric strong{font-size:22px}.cards{grid-template-columns:1fr;gap:12px}.card{min-height:230px}.card-art{height:86px}.card-body{padding:14px 16px}.toolbar{align-items:stretch}.search{min-width:100%;flex:auto}.filters{max-width:100%;overflow:auto;flex-wrap:nowrap;padding-bottom:5px}.filter{flex-shrink:0}.sort{margin-left:auto}.detail-top{padding:27px 20px 20px}.detail-body{padding:22px 20px;gap:20px}.footer{margin-top:40px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

<main class="shell"><section class="hero"><div class="eyebrow">PERSONAL STAND ENCYCLOPEDIA · VOL. 01</div><h1>능력에는<br><em>반드시 규칙이 있다.</em></h1><p class="lead">직접 만든 오리지널 스탠드를 한곳에 정리한 도감. 스탠드의 능력과 약점, 원작식 유형, 육각형 파라미터를 살펴볼 수 있습니다.</p><div class="metrics"><div class="metric"><strong id="totalCount">19</strong><span>등록된 스탠드</span></div><div class="metric"><strong id="typeCount">6</strong><span>분류 카테고리</span></div><div class="metric"><strong>6</strong><span>능력 파라미터</span></div></div></section>

<script id="stand-data" type="application/json">[{"id":"ballroom-blitz","name":"BALLROOM BLITZ","category":"근거리형","subtype":"공간 격리 · 현상형","stats":["B","B","D","C","E","E"],"ability":"독립된 구형 공간 생성","description":"투명한 구형 공간을 만들어 내부와 외부의 물리적 간섭을 차단한다. 방울 속의 물체나 사람을 외부 공격으로부터 격리할 수 있고, 내부 충돌과 반사 각도를 전술적으로 활용한다.","rules":"구형 공간은 유지 범위와 지속 시간에 제약이 있다. 외부의 간섭을 막는 동시에 내부에서 외부로 향하는 직접 간섭도 제한한다.","weakness":"방울이 사라지는 타이밍을 노리거나 내부에서 발생하는 움직임을 역이용할 수 있다.","appearance":"BALL과 ROOM을 나눈 구형 공간 콘셉트.","source":"Sweet","color":"#a896ec","status":"일반","form":"현상형","traits":[]},{"id":"drain-you","name":"DRAIN YOU","category":"원격조작형","subtype":"기생형 · 비인간형","stats":["E","D","C","A","D","A"],"ability":"감각과 신체 반응 흡수","description":"약 8cm의 거머리형 스탠드가 대상에게 흡착해 통증, 피로, 균형감각, 반사 반응 등을 흡수하고 다른 대상에게 전달한다.","rules":"대상에게 흡착해야 한다. 자체적인 물리 공격력은 낮다.","weakness":"부착된 스탠드를 발견하고 제거하거나 흡착을 방지한다.","appearance":"작고 어두운 거머리 형태.","source":"Nirvana","color":"#74c8a9","status":"일반","form":"비인간형","traits":[]},{"id":"eleanor-rigby","name":"ELEANOR RIGBY","category":"원격자동조종형","subtype":"인식 간섭 · 현상형","stats":["E","E","C","A","B","E"],"ability":"대상의 인식 삭제","description":"특정 대상을 술사 이외의 모든 사람이 인식하지 못하게 한다. 카메라·사진·녹화 영상 등을 통해서도 대상의 존재를 알아보지 못한다.","rules":"발동 전에 대상에게 닿아 있었고 그 접촉을 끊지 않았다면 인식이 유지된다. 발동 후 새로 접촉하는 것만으로는 복구되지 않는다.","weakness":"능력 발동 전부터 유지한 물리적 접촉이 중요한 예외다.","appearance":"존재가 흐려지고 인식되지 않는 희미한 형상.","source":"The Beatles","color":"#b2a5d4","status":"일반","form":"현상형","traits":[]},{"id":"message-in-a-bottle","name":"MESSAGE IN A BOTTLE","category":"원격조작형","subtype":"원격조작 · 저주형","stats":["E","E","-","A","A","-"],"ability":"소망을 미끼로 불행 부여","description":"유리병을 보는 사람마다 병 속에서 자신이 가장 원하는 것을 발견한다. 병의 마개를 열면 불행이 개봉자에게 스며들고, 점차 현실화될 악재가 적힌 쪽지가 나온다.","rules":"마개를 열어야 저주가 시작된다. 불행은 점진적으로 강해진다.","weakness":"병을 열지 않거나, 쪽지에 기록된 악재를 분석해 대비한다.","appearance":"코르크 마개가 끼워진 유리병 자체.","source":"The Police","color":"#d8a66b","status":"일반","form":"비인간형","traits":["도구형"]},{"id":"lithium","name":"LITHIUM","category":"근거리 파워형","subtype":"물질 특성 변환","stats":["B","A","D","B","C","E"],"ability":"리튬의 물성 부여","description":"접촉한 물질에 리튬 금속의 물성을 부여한다. 가벼움, 무름, 전기전도성, 물에 대한 높은 반응성 등이 함께 나타난다.","rules":"물질의 실제 원소 조성을 바꾸는 것은 아니다. 유리한 물성만 선택할 수 없다.","weakness":"리튬의 취약한 성질을 역이용하거나 접촉을 피한다.","appearance":"기계적 갑각과 금속성 손을 가진 근거리형.","source":"Nirvana","color":"#a4c7db","status":"일반","form":"인간형","traits":[]},{"id":"slippery-people","name":"SLIPPERY PEOPLE","category":"근거리형","subtype":"저항 제거 · 현상형","stats":["C","B","D","B","C","E"],"ability":"물리적 저항 제거","description":"술사 주위에서 마찰·공기저항·점성 등의 저항을 제거한다. 술사 자신의 저항은 자유롭게 조절해 미끄러지다가 급정지할 수 있다.","rules":"주변 환경의 저항이 제거되어 자신에게도 예상하지 못한 결과가 발생할 수 있다.","weakness":"저항이 사라진 지형·궤도를 예측하거나 외부 요인으로 이동을 제어한다.","appearance":"매끄럽고 유선형인 금속성 실루엣.","source":"Talking Heads","color":"#80bacf","status":"일반","form":"인간형","traits":[]},{"id":"television-man","name":"TELEVISION MAN","category":"근거리형","subtype":"비인간형 · 화면 실체화","stats":["E","C","C","A","C","B"],"ability":"화면 속 존재·사물의 실체화","description":"술사가 접촉한 TV·스마트폰·모니터 화면에 등장하는 사물과 존재를 현실로 꺼낸다. 실체화된 존재는 원래 화면 속에 나타난 행동만 수행하며, 크기와 위력은 화면 크기에 비례한다.","rules":"여러 접촉한 화면을 동시에 활용할 수 있다. 술사가 재흡수 가능하며 화면이 꺼지면 실체가 소멸한다.","weakness":"화면을 끄거나, 화면 속 행동 패턴의 제한을 이용한다.","appearance":"화면과 전자기기 모티브의 비인간형.","source":"Talking Heads","color":"#a18cec","status":"일반","form":"비인간형","traits":[]},{"id":"old-fashioned-lover-boy","name":"OLD-FASHIONED LOVER BOY","category":"근거리형","subtype":"거리 고정 · 현상형","stats":["-","-","-","A","-","E"],"ability":"두 대상 사이 거리 고정","description":"스탠드가 양손으로 두 대상을 각각 만지면 두 대상 사이의 거리가 고정된다. 상대적인 회전이나 측면 이동은 가능하지만 거리를 좁히거나 벌릴 수 없다.","rules":"거리 고정은 최대 1분간 유지된다.","weakness":"거리 자체를 바꾸기보다 고정된 거리를 유지한 채 움직이는 방식을 활용한다.","appearance":"세련된 균형적 몸체와 서로 다른 두 손.","source":"Queen","color":"#dca3c2","status":"일반","form":"인간형","traits":[]},{"id":"drowning-pool","name":"DROWNING POOL","category":"근거리형","subtype":"지형 침강 · 현상형","stats":["C","B","D","B","C","E"],"ability":"정상적인 지면을 늪처럼 침강시킴","description":"발바닥 이외의 신체 부위가 지면에 닿은 대상은 평범해 보이는 바닥 속으로 가라앉는다. 몸부림칠수록 더욱 깊이 빠져든다.","rules":"능력 반경은 약 8m. 지면과의 접촉 방식이 중요하다.","weakness":"똑바로 서 있거나, 천천히 움직이며 넓은 지지대와 외부 구조를 활용한다.","appearance":"짙은 녹색과 갈색의 늪지형 비인간형.","source":"Drowning Pool","color":"#779c79","status":"일반","form":"비인간형","traits":[]},{"id":"sleep-not-yet","name":"SLEEP NOT YET","category":"원격자동조종형","subtype":"악몽 구현 · 자율 이동","stats":["-","E","-","A","D","A"],"ability":"술사의 악몽을 현실화","description":"술사가 잠들면 자동 발동하여 반경 5km 내에서 자유롭게 돌아다닌다. 술사가 꾸는 악몽의 사건·장소·존재가 스탠드 주변에서 현실로 구현된다.","rules":"술사가 잠에서 깨는 즉시 종료된다. 악몽의 내용은 술사가 의식적으로 제어할 수 없다.","weakness":"술사를 깨우거나 꿈의 전개·규칙을 파악한다.","appearance":"악몽을 구체화하는 섬뜩한 자율형 개체.","source":"Slipknot (변형 명칭)","color":"#b67d91","status":"일반","form":"비인간형","traits":["자율형"]},{"id":"green-pajama","name":"GREEN PAJAMA","category":"사정거리 무관계","subtype":"패치 부착 · 위치 귀환","stats":["-","-","-","A","C","C"],"ability":"정지한 대상의 지정 위치 귀환","description":"녹색 파자마의 앞주머니에서 5cm² 파자마 무늬 패치를 꺼내 사람 또는 무생물에 붙인다. 대상이 1초간 완전히 멈추면 부착 당시의 위치와 자세로 돌아간다.","rules":"패치를 부착하기 전까지 계속 꺼낼 수 있다. 하나를 붙이면 이전에 꺼내 놓은 미사용 패치가 소멸한다. 귀환은 대상당 1회.","weakness":"강제 귀환 조건인 완전한 정지를 피하거나, 기록된 위치를 역이용한다.","appearance":"녹색 실크 파자마, 페이즐리 무늬, 금빛 단추.","source":"Green Pajamas","color":"#79b994","status":"일반","form":"비인간형","traits":["장착형"]},{"id":"pyt","name":"PRETTY YOUNG THING","category":"근거리형","subtype":"이동 우선권 · 현상형","stats":["D","B","C","C","B","A"],"ability":"이동 대상에게 길을 양보","description":"한 대상에게 이동 우선권을 부여한다. 지정 대상이 움직이면 경로를 가로막는 주변의 이동 가능한 물체나 사람이 양옆으로 밀려 길을 내준다.","rules":"지정 대상 스스로 움직여야 작동한다. 고정된 구조물은 비켜나지 않는다.","weakness":"고정된 장애물과 경로 제한을 활용하거나 이동 자체를 막는다.","appearance":"청동색의 비대칭 골격과 세 겹의 원판형 머리.","source":"Michael Jackson","color":"#d7a078","status":"일반","form":"인간형","traits":[]},{"id":"chop-suey","name":"CHOP SUEY!","category":"근거리형","subtype":"분할 · 구조 재배열","stats":["C","A","D","C","A","B"],"ability":"절단선으로 구분한 부분 순서 변경","description":"스탠드의 손날로 평행한 절단선 두 개를 만들고 물체를 최대 3부분으로 구분한다. 각 부분의 순서를 변경하며, 생명체는 분할 자체로 상처받지 않는다.","rules":"질량·재질은 변하지 않으며 순서만 변경한다. 최대 20초 유지.","weakness":"접촉을 피하거나 재배열된 신체 구조를 새롭게 활용한다.","appearance":"층층이 나뉜 머리와 원반형 몸통, 손날.","source":"System of a Down","color":"#d7898b","status":"일반","form":"인간형","traits":[]},{"id":"505","name":"505","category":"사정거리 무관계","subtype":"물질동화 · 독립형","stats":["E","-","-","A","B","E"],"ability":"열린 모든 출입구를 505호에 연결","description":"호텔의 유일한 파란 방문 505호 자체가 스탠드다. 문에 닿은 한 명의 지문이 등록되고, 등록자가 직접 열거나 개방을 유발한 문·창문·서랍·자동문 등이 505호에 연결된다.","rules":"파란 원본 문은 파괴 불가. 다른 사람이 문을 만지면 이전 지문은 떨어져 사라지고 등록자가 교체된다.","weakness":"등록되지 않은 사람이 대신 문을 열어 주거나, 제삼자가 파란 방문에 접촉해 지문을 교체한다.","appearance":"오래된 호텔의 은색 505 숫자가 붙은 파란 방문.","source":"Arctic Monkeys","color":"#6196d6","status":"일반","form":"비인간형","traits":["실체화형"]},{"id":"in-utero","name":"IN UTERO","category":"자동형","subtype":"자동방어 · 운동 반전","stats":["-","E","C","A","E","A"],"ability":"주변 운동 방향 180도 반전","description":"최종 보스의 스탠드가 태아형 고치로 변한 진화 중간 단계. 술사를 제외한 반경 10m 내 대상의 운동 방향을 반전한다.","rules":"하나의 운동에는 시작 시 또는 범위 진입 시 한 번만 반전을 적용한다. 크기는 유지된다.","weakness":"반대 방향으로 운동을 의도하거나 정지 상태의 구조물을 이용한다.","appearance":"검은 탯줄로 술사와 이어진 유백색 태아형 고치.","source":"Nirvana (앨범)","color":"#af93b5","status":"진화 중","form":"비인간형","traits":["진화형"]},{"id":"new-born","name":"NEW BORN","category":"죽은 스탠드","subtype":"완전자율 · 운동 전이","stats":["A","A","C","-","B","E"],"ability":"한 물체의 운동을 다른 물체로 이전","description":"IN UTERO에서 최종 진화한 존재. 한 물체의 이동 속도와 방향을 다른 자유 이동 대상에게 넘겨, 원래 물체는 정지하고 새 대상이 그 운동을 이어받게 한다. 진화 직후 보스의 복부를 관통해 살해한다.","rules":"운동의 생성·복제·임의 방향 변경은 불가능. 술사의 죽음 이후에도 독립적으로 존재하고 행동한다.","weakness":"운동을 빼앗길 대상과 전달받을 대상의 선택을 잘못하도록 유도한다.","appearance":"유백색 갑각, 두 개의 팔꿈치, 검은 나선 복부, 인간형 완전체.","source":"Muse","color":"#c7abdd","status":"최종 진화","form":"인간형","traits":["진화형","자율형"]},{"id":"wonderwall","name":"WONDERWALL","category":"사정거리 무관계","subtype":"안대 · 물질 투과","stats":["E","C","E","A","D","B"],"ability":"눈 감는 동안 물질 투과","description":"술사가 눈을 감으면 안대형 스탠드가 나타나 신체와 물체 사이 충돌이 무효화된다. 벽과 적의 공격을 그대로 통과한다.","rules":"눈을 감은 동안 술사 자신도 물체를 잡거나 상대를 공격할 수 없다. 보행을 위해 지면과의 접촉은 유지된다.","weakness":"시각 정보를 차단하거나 눈을 뜨는 순간을 노린다.","appearance":"눈꺼풀이 겹친 듯한 유백색 착용형 안대.","source":"Oasis","color":"#97b2e0","status":"일반","form":"비인간형","traits":["장착형"]},{"id":"champagne-supernova","name":"CHAMPAGNE SUPERNOVA","category":"근거리 파워형","subtype":"접촉 분리 · 기포 팽창","stats":["A","B","C","D","B","C"],"ability":"접촉면에 기포를 만들어 분리","description":"별개의 두 물체가 맞닿은 접촉면에 기포를 만들고 팽창시켜 서로 밀어낸다. 작은 틈으로 거대한 구조물의 균형을 무너뜨리는 것이 특징이다.","rules":"기포는 충격이나 날카로운 물체에 터질 수 있으며 지속시간이 짧다. 무거운 고정물은 쉽게 분리되지 않는다.","weakness":"기포를 터뜨리거나 접촉 상태를 바꾸고 팽창 방향을 역이용한다.","appearance":"진주색과 자주색의 몸체 안에서 황금색 기포가 떠오른다.","source":"Oasis","color":"#d9b269","status":"일반","form":"인간형","traits":[]},{"id":"crazy-little-thing","name":"CRAZY LITTLE THING","category":"원격조작형","subtype":"부착 · 습관 강제","stats":["E","B","C","B","A","B"],"ability":"사소한 버릇을 모든 행동의 선행 조건으로","description":"작은 스탠드가 상대의 무의식적 버릇을 관찰해 몸에 접촉하면, 그 상대는 이후 새로운 의도적인 행동을 시작할 때마다 등록된 버릇부터 실행해야 한다.","rules":"한 번에 버릇 하나만 등록할 수 있다. 이미 진행 중인 행동은 중단시키지 않는다.","weakness":"등록된 버릇을 자신의 전술에 포함시키거나 행동 시작의 빈틈을 줄인다.","appearance":"키 25cm, 청록색 몸통과 큰 손, 비대칭 눈을 가진 소형 개체.","source":"Queen","color":"#7ebbc1","status":"일반","form":"인간형","traits":[]},{"id":"high-and-dry","name":"HIGH AND DRY","category":"근거리형","subtype":"중거리 · 점진적 고산 환경 조성","stats":["E","C","B","A","C","C"],"ability":"시간에 따라 주변 대기를 고산 환경으로 변화","description":"발동 순간부터 스탠드 중심 반경 30m의 환경이 점진적으로 고산지대와 같아진다. 1분에 해발 약 1,000m 상당씩 기압·산소 분압·기온이 낮아져 8분 후 8,000m 상당에 도달하며 그 뒤에는 유지된다. 지형과 중력은 바뀌지 않는다.","rules":"술사가 고도나 진행 속도를 임의로 조절할 수 없다. 변화는 연속적으로 일어나며 8분 후 최고 단계에 도달한다. 술사도 영향을 받는다. 능력을 해제하면 30초에 걸쳐 대기가 정상화되며 재발동은 0m부터 다시 시작한다.","weakness":"환경 변화에는 시간이 필요하고, 술사도 저압·저산소·저온의 영향을 받는다. 범위 밖으로 이탈하거나 술사의 산소 공급 장비를 무력화하면 대응할 수 있다. 고도 적응 및 생명유지 장비에도 취약하다.","appearance":"키 약 195cm의 마른 인간형. 석회색·청회색 갑각과 몸을 감싼 등고선 무늬, 긴 팔과 다리, 좁은 얼굴의 틈 두 개가 특징.","source":"Radiohead","color":"#83a7c6","status":"일반","form":"인간형","traits":[]},{"id":"big-cheese","name":"BIG CHEESE","category":"근거리 파워형","subtype":"물질 변환 · 치즈화","stats":["A","B","D","C","B","C"],"ability":"접촉한 물체 또는 생물의 신체를 치즈화","description":"스탠드의 손이 닿은 대상의 전체나 일부를 치즈처럼 부드러운 물질로 바꾼다. 치즈화된 신체가 찌그러지거나 늘어나거나 분리되더라도 변형 자체가 상해로 남지 않으며, 해제 시 원래 상태로 복원된다. 기존의 상처까지 치료되는 것은 아니다.","rules":"손바닥의 직접 접촉이 필요하다. 대상 전체 또는 일부분을 최대 약 2m³까지 변환할 수 있고, 동시 대상은 최대 2개, 지속시간은 30초다. 해제 시 치즈화로 생긴 변형만 복원하며 본래의 상처는 유지된다.","weakness":"근거리에서 직접 만져야 한다. 치즈화 자체는 상해를 입히지 않아 제압 중심으로 사용하며, 변환된 몸이나 지형은 시간이 지나면 복원된다.","appearance":"약 210cm의 거대한 황백색 인간형. 원형 구멍이 뚫린 두꺼운 갑각과 사각형에 가까운 커다란 주먹이 특징이다.","source":"Nirvana","color":"#dfb75b","status":"일반","form":"인간형","traits":[]}]</script>
<script>
(()=>{'use strict';
const baseline=JSON.parse(document.getElementById('stand-data').textContent);
const LS_KEY='stand_archive_user_data_v1';
let custom=[];try{const x=JSON.parse(localStorage.getItem(LS_KEY)||'[]');if(Array.isArray(x))custom=x}catch(e){}
const all=()=>{const map=new Map(baseline.map(x=>[x.id,x]));custom.forEach(x=>map.set(x.id,x.id==='pyt'&&x.name==='P.Y.T.'?{...x,name:'PRETTY YOUNG THING'}:x));return [...map.values()]};
const alphabetical=()=>all().sort((a,b)=>a.name.toUpperCase().localeCompare(b.name.toUpperCase(),'en'));
const standNumber=id=>String(alphabetical().findIndex(x=>x.id===id)+1).padStart(3,'0');
const cats=['전체','근거리 파워형','근거리형','원격조작형','원격자동조종형','자동형','죽은 스탠드','사정거리 무관계','진화형','장착형','도구형','실체화형'];
let selected='전체';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const abbrev={'근거리 파워형':'근거리 파워','근거리형':'근거리','원격조작형':'원격조작','원격자동조종형':'원격자동','자동형':'자동','죽은 스탠드':'사후 존속','사정거리 무관계':'일체화/무관','진화형':'진화','장착형':'장착','도구형':'도구','실체화형':'실체화'};
function statsSvg(vals,color){const cx=160,cy=146,R=100;const pos=(i,r)=>[cx+Math.cos(-Math.PI/2+i*Math.PI/3)*r,cy+Math.sin(-Math.PI/2+i*Math.PI/3)*r];const grade=n=>({A:5,B:4,C:3,D:2,E:1,'-':0}[n]??0);const polygon=arr=>arr.map(([x,y])=>x.toFixed(2)+','+y.toFixed(2)).join(' ');let out='<svg viewBox="0 0 320 318" role="img" aria-label="파괴력, 스피드, 사정거리, 지속력, 정밀동작성, 성장성 육각형 그래프">';for(let r=1;r<=5;r++)out+=`<polygon points="${polygon(Array.from({length:6},(_,i)=>pos(i,R*r/5)))}" fill="none" stroke="#596078" opacity="${r===5?.75:.36}" stroke-width="1"/>`;for(let i=0;i<6;i++){const [x,y]=pos(i,R);out+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#596078" opacity=".55" />`};const ps=vals.map((n,i)=>pos(i,R*grade(n)/5));out+=`<polygon points="${polygon(ps)}" stroke="${color}" stroke-width="2.6" fill="${color}" fill-opacity=".22" stroke-linejoin="round"/>`;ps.forEach(([x,y],i)=>{out+=`<circle cx="${x}" cy="${y}" r="4.2" fill="${vals[i]==='-'?'#edc68a':color}"/>`});const labels=[['파괴력',160,19],['스피드',277,80],['사정거리',278,217],['지속력',160,291],['정밀동작성',40,217],['성장성',42,80]];labels.forEach(([label,x,y],i)=>{out+=`<text x="${x}" y="${y}" fill="#c9cee0" font-size="11" font-weight="700" text-anchor="middle">${label}</text><text x="${x}" y="${y+14}" fill="${vals[i]==='-'?'#edc68a':color}" font-size="12" font-weight="800" text-anchor="middle">${esc(vals[i])}</text>`});return out+'</svg>'}
function render(){const q=$('search').value.trim().toLowerCase();const sort=$('sort').value;let items=all().filter(x=>(selected==='전체'||x.category===selected||(x.traits||[]).includes(selected))&&[x.name,x.ability,x.description,x.source,x.subtype,x.category,x.form,...(x.traits||[])].some(y=>String(y).toLowerCase().includes(q)));if(sort==='alpha')items.sort((a,b)=>a.name.toUpperCase().localeCompare(b.name.toUpperCase(),'en'));if(sort==='power')items.sort((a,b)=>'ABCDE-'.indexOf(a.stats[0])-'ABCDE-'.indexOf(b.stats[0]));$('totalCount').textContent=all().length;$('typeCount').textContent=new Set(all().map(x=>x.category)).size;$('resultCount').textContent=`검색 결과 ${items.length} / 전체 ${all().length}종`;
$('cards').innerHTML=items.map((x,i)=>`<button class="card" data-id="${esc(x.id)}" aria-label="${esc(x.name)} 상세 보기"><div class="card-art" style="--tint:${esc(x.color)}77"><div class="art-index">NO. ${standNumber(x.id)}</div><div class="symbol">✦</div><div class="art-type">${esc(x.category)} · ${esc(x.form||"미정")}</div></div><div class="card-body"><h3>${esc(x.name)}${x.status&&x.status!=='일반'?`<span class="badge-special">${esc(x.status)}</span>`:''}</h3><div class="ability">${esc(x.ability)}</div><p class="summary">${esc(x.description)}</p><div class="card-bottom"><div class="grades">${x.stats.map(s=>`<span class="grade ${s==='-'?'unknown':''}">${esc(s)}</span>`).join('')}</div><span class="more">상세 보기 +</span></div></div></button>`).join('')||'<div class="no-results">조건에 맞는 스탠드가 없습니다.</div>';
$('cards').querySelectorAll('.card').forEach(el=>el.addEventListener('click',()=>openDetail(el.dataset.id)))}
function openDetail(id){const x=all().find(y=>y.id===id);if(!x)return;$('detailContent').innerHTML=`<div class="detail-top" style="--tint:${esc(x.color)}4f"><button class="close" id="closeDetail" aria-label="닫기">×</button><div class="detail-kicker">NO. ${standNumber(x.id)} · STAND PROFILE</div><div class="detail-title">『${esc(x.name)}』</div><div class="detail-sub">${esc(x.subtype)} ${x.status&&x.status!=='일반'?'· '+esc(x.status):''}　/　음악 모티브: ${esc(x.source)}</div></div><div class="detail-body"><div><h4>STAND TYPE · 문서 8번 기준 분류</h4><p><strong>활동·조작 방식:</strong> ${esc(x.category)}<br><strong>외형:</strong> ${esc(x.form||"미정")}<br><strong>특수 유형:</strong> ${esc((x.traits||[]).join(" · ")||"해당 없음")}</p><h4>MAIN ABILITY · 핵심 능력</h4><div style="font-size:21px;font-weight:800;margin:0 0 12px;color:${esc(x.color)}">${esc(x.ability)}</div><p>${esc(x.description)}</p><h4>RULES · 발동 조건과 제한</h4><p>${esc(x.rules)}</p><h4>COUNTERPLAY · 약점과 파훼</h4><p>${esc(x.weakness)}</p><h4>APPEARANCE · 외형</h4><p>${esc(x.appearance)}</p></div><div class="radar-panel"><div class="radar-head">STAND PARAMETERS</div>${statsSvg(x.stats,x.color)}<table class="stat-table">${['파괴력','스피드','사정거리','지속력','정밀동작성','성장성'].map((n,i)=>`<tr><td>${n}</td><td>${esc(x.stats[i])}</td></tr>`).join('')}</table><div class="stat-note">※ '-'는 무제한 또는 측정 불가. 그래프에서는 표기 규칙에 따라 중심점에 배치하며, 여섯 꼭짓점을 이어 완성된 도형으로 표시합니다.</div></div></div>`;$('closeDetail').addEventListener('click',()=> $('detail').close());$('detail').showModal()}
$('detail').addEventListener('click',e=>{if(e.target===$('detail'))$('detail').close()});
$('filters').innerHTML=cats.map(c=>`<button class="filter ${c===selected?'active':''}" data-cat="${c}" aria-pressed="${c===selected}">${c==='전체'?'전체':abbrev[c]}</button>`).join('');$('filters').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.cat;$('filters').querySelectorAll('button').forEach(el=>{const on=el.dataset.cat===selected;el.classList.toggle('active',on);el.setAttribute('aria-pressed',on)});render()}));$('search').addEventListener('input',render);$('sort').addEventListener('change',render);
function exportJson(){const payload={format:'stand-archive',version:1,exportedAt:new Date().toISOString(),stands:all()};const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='stand-archive-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}$('exportBtn').addEventListener('click',exportJson);$('exportBtnTop').addEventListener('click',exportJson);$('importBtn').addEventListener('click',()=>$('importFile').click());
$('importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const parsed=JSON.parse(await f.text());const stands=Array.isArray(parsed)?parsed:parsed.stands;if(!Array.isArray(stands)||!stands.every(x=>x&&typeof x.name==='string'&&typeof x.id==='string'&&Array.isArray(x.stats)&&x.stats.length===6))throw new Error('올바른 도감 JSON 형식이 아닙니다.');custom=stands;localStorage.setItem(LS_KEY,JSON.stringify(custom));render();alert(`${stands.length}개 스탠드 데이터를 불러왔습니다.`)}catch(err){alert('가져오기 실패: '+err.message)}finally{e.target.value=''}});
$('resetBtn').addEventListener('click',()=>{if(confirm('브라우저에 저장된 변경사항을 지우고 이 파일의 기본 도감으로 복원할까요?')){custom=[];localStorage.removeItem(LS_KEY);render()}});
render();})();
</script></body></html>
